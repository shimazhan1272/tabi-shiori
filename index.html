<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅のしおり帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: 1カラムの手帳。上部に旅のヘッダーとタブ、下に各ページ。旅程は時刻＋縦のタイムライン。 */
:root{
  --paper:#f4f6f3; --card:#ffffff; --ink:#1d2733; --muted:#5b6975; --line:#d8dee1;
  --sea:#0d7480; --sea-ink:#ffffff; --sea-soft:#e0eff0; --sun:#c98612; --danger:#b83b28;
  --c-sight:#0d7480; --c-food:#c98612; --c-stay:#6a5bb5; --c-move:#55626d; --c-shop:#bf4f7a; --c-other:#8a8f6a;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12181c; --card:#1a2228; --ink:#e5ebee; --muted:#95a3ad; --line:#2d3942;
  --sea:#4cb8c2; --sea-ink:#0c1a1d; --sea-soft:#163338; --sun:#e6ae4c; --danger:#ee7c66;
  --c-sight:#4cb8c2; --c-food:#e6ae4c; --c-stay:#a497ef; --c-move:#9aa8b3; --c-shop:#ec86ad; --c-other:#bcc191;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#12181c; --card:#1a2228; --ink:#e5ebee; --muted:#95a3ad; --line:#2d3942;
  --sea:#4cb8c2; --sea-ink:#0c1a1d; --sea-soft:#163338; --sun:#e6ae4c; --danger:#ee7c66;
  --c-sight:#4cb8c2; --c-food:#e6ae4c; --c-stay:#a497ef; --c-move:#9aa8b3; --c-shop:#ec86ad; --c-other:#bcc191;
  color-scheme:dark; }

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:var(--sea)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.brand{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.trip-title{font-size:clamp(22px,4.5vw,32px)}
.trip-sub{color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.saved{font-size:12px;color:var(--muted);min-height:1.2em;transition:opacity .3s}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{flex:none;background:none;border:0;padding:9px 12px;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sea);font-weight:700}

.panel{display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.sec-head h2{font-size:19px}
.hint{color:var(--muted);font-size:13px;margin:0}

/* forms */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 14px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.03em;min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],input[type=tel],input[type=email],select,textarea{
  width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:15px}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{border-color:var(--sea);outline:none;box-shadow:0 0 0 3px var(--sea-soft)}
.static{padding:8px 0;font-size:15px;color:var(--ink);font-weight:700}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--sea)}
.btn.pri{background:var(--sea);color:var(--sea-ink);border-color:var(--sea)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:var(--card);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--danger);background:var(--sea-soft)}

/* schedule */
.day{display:flex;flex-direction:column;gap:6px}
.day-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.day-no{font-family:var(--f-display);font-size:20px}
.day-date{font-weight:700}
.day-sum{margin-left:auto;color:var(--muted);font-size:13px}
.tl{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:62px 18px minmax(0,1fr) auto;gap:0 10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:start}
.ev-time{font-family:var(--f-mono);font-size:15px;text-align:right;line-height:1.35;padding-top:1px}
.ev-time small{display:block;color:var(--muted);font-size:12px}
.ev-dot{position:relative;align-self:stretch}
.ev-dot::before{content:"";position:absolute;left:8px;top:-10px;bottom:-11px;width:2px;background:var(--line)}
.ev-dot::after{content:"";position:absolute;left:3px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--cat);border:2px solid var(--card)}
.ev-title{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.ev-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:var(--muted)}
.ev-memo{font-size:13px;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.ev-link{font-size:13px;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;color:var(--cat);background:color-mix(in srgb,var(--cat) 14%,transparent)}
.chip.mv{--cat:var(--c-move);font-weight:500}
.cat-sight{--cat:var(--c-sight)} .cat-food{--cat:var(--c-food)} .cat-stay{--cat:var(--c-stay)}
.cat-move{--cat:var(--c-move)} .cat-shop{--cat:var(--c-shop)} .cat-other{--cat:var(--c-other)}
.editor{border:1px solid var(--sea);border-radius:var(--r);background:var(--sea-soft);padding:14px;margin:8px 0;display:flex;flex-direction:column;gap:12px}
.editor input,.editor select,.editor textarea{background:var(--card)}
.empty-day{color:var(--muted);font-size:14px;padding:10px 0}

/* lists */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;gap:8px;align-items:center}
.row-head{font-size:12px;color:var(--muted);font-weight:500}
.r-souv{grid-template-columns:2fr 1.5fr 1.2fr 110px 1.6fr 34px}
.r-ros{grid-template-columns:1.4fr 1.4fr 1.8fr 1.6fr 1.4fr 34px}
.r-pack{grid-template-columns:28px 1fr 34px}
.r-pack input[type=checkbox]{width:20px;height:20px;accent-color:var(--sea)}
.r-pack.done input[type=text]{text-decoration:line-through;color:var(--muted)}
@media (max-width:680px){
  .r-souv,.r-ros{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--line);border-radius:8px}
  .r-souv .x,.r-ros .x{justify-self:end}
  .row-head{display:none}
  .ev{grid-template-columns:50px 16px minmax(0,1fr)}
  .ev > .btn{grid-column:3;justify-self:start;margin-top:6px}
}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
.pchip:hover{border-color:var(--sea)}
.pchip[aria-pressed="true"]{background:var(--sea);color:var(--sea-ink);border-color:var(--sea);font-weight:700}
.pchip.add{border-style:dashed;color:var(--sea)}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--sea);transition:width .3s}
.total{display:flex;justify-content:flex-end;gap:12px;font-weight:700;font-size:16px;padding-top:6px;border-top:1px solid var(--line)}

/* costs */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:12px 14px;border-radius:var(--r);background:var(--sea-soft)}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.key{background:var(--sea);color:var(--sea-ink)} .stat.key span{color:inherit;opacity:.85}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:70px minmax(0,1fr) 92px 40px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--cat)}
.bar .amt{text-align:right;font-family:var(--f-mono)} .bar .cnt{color:var(--muted);font-size:12px;text-align:right}
.fx{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}

/* library */
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.plan{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.plan.cur{border-color:var(--sea);box-shadow:inset 0 0 0 1px var(--sea)}
.plan h3{font-size:16px;overflow-wrap:anywhere}
.plan .meta{font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;color:var(--sea);border:1px solid var(--sea);border-radius:99px;padding:0 8px;margin-left:6px;vertical-align:2px}

/* shiori (booklet) */
.booklet{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:28px}
.cover{text-align:center;padding:20px 0 26px;border-bottom:2px solid var(--ink);display:flex;flex-direction:column;gap:8px;align-items:center}
.cover .lead{font-size:12px;letter-spacing:.3em;color:var(--muted);font-weight:700}
.cover h2{font-size:clamp(26px,5vw,38px)}
.cover .period{font-family:var(--f-mono);font-size:15px}
.cover .nights{display:inline-block;border:2px solid var(--sun);color:var(--sun);border-radius:6px;padding:2px 12px;font-weight:700;transform:rotate(-3deg)}
.b-sec h3{font-size:18px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.b-sec h3::after{content:"";flex:1;border-top:1px solid var(--line)}
.b-ev{display:grid;grid-template-columns:62px 18px minmax(0,1fr) auto;gap:0 10px;padding:8px 0}
.qr{width:72px;height:72px;flex:none}
.qr img,.qr canvas{width:72px!important;height:72px!important;background:#fff;padding:3px;border-radius:4px}
.b-table{width:100%;border-collapse:collapse;font-size:14px;color:var(--ink)}
.b-table th,.b-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.b-table th{font-size:12px;color:var(--muted);font-weight:500}
.b-table td.n{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 16px;list-style:none;padding:0;margin:0}
.checks li{padding:2px 0}
.checks li::before{content:"□ ";color:var(--muted)} .checks li.on::before{content:"☑ ";color:var(--sea)}
.toggles{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px}
.toggles input{accent-color:var(--sea)}

.note{font-size:13px;color:var(--muted);background:var(--sea-soft);border-radius:8px;padding:10px 12px}
.msg{font-size:14px;font-weight:700}
.msg.ok{color:var(--sea)} .msg.err{color:var(--danger)}

/* PDF用の書き出し面（画面外に置いて撮影する。常にライト配色） */
.pdf-sheet{position:fixed;left:-10000px;top:0;width:794px;
  --paper:#ffffff;--card:#ffffff;--ink:#1d2733;--muted:#5b6975;--line:#d8dee1;--sea:#0d7480;--sea-ink:#ffffff;--sea-soft:#e0eff0;--sun:#c98612;
  --c-sight:#0d7480;--c-food:#c98612;--c-stay:#6a5bb5;--c-move:#55626d;--c-shop:#bf4f7a;--c-other:#8a8f6a;
  background:#fff;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.pdf-sheet .booklet{border:0;border-radius:0;padding:36px 40px}
.pdf-sheet .chip{background:transparent;border:1px solid var(--cat)}
@media print{
  .top .saved,.tabs,.no-print{display:none!important}
  body{background:#fff;padding:0}
  .booklet{border:0;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">旅のしおり帳</div>
      <h1 class="trip-title" id="hTitle"></h1>
      <div class="trip-sub" id="hSub"></div>
    </div>
    <div class="saved" id="saved" aria-live="polite"></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main class="panel" id="panel"></main>
</div>

<script>
(function(){
const K_LIB='tabiShiori.library.v1', K_CUR='tabiShiori.current.v1', K_TAB='tabiShiori.tab.v1';
const MAX_PLANS=20;
const CATS=[['sight','観光'],['food','食事'],['stay','宿泊'],['move','移動'],['shop','買い物'],['other','その他']];
const CAT_LABEL=Object.fromEntries(CATS);
const TRANS=['','徒歩','電車','新幹線','バス','車','タクシー','飛行機','船','自転車'];
const K_PRE='tabiShiori.presets.v1';
const PRESETS={
  domestic:['財布','スマートフォン','充電器・ケーブル','モバイルバッテリー','着替え','下着・靴下','パジャマ','歯ブラシ','洗面用具','常備薬','ハンカチ・ティッシュ','折りたたみ傘','健康保険証','エコバッグ'],
  overseas:['パスポート','航空券（eチケット控え）','現地通貨・クレジットカード','海外旅行保険証','変換プラグ','SIM / Wi-Fiルーター','スマートフォン','充電器・ケーブル','着替え','常備薬','歯ブラシ','ボールペン（入国書類用）','パスポートのコピー','ネックピロー'],
  outdoor:['登山靴','レインウェア','ザック・ザックカバー','ヘッドランプ','地図・コンパス','行動食','水（1L以上）','帽子','防寒着','手袋','救急セット','日焼け止め','登山届の控え'],
  beach:['水着','ラッシュガード','ビーチサンダル','日焼け止め','サングラス','帽子','タオル','防水ポーチ','着替え','ビニール袋（濡れ物用）','虫よけ'],
  business:['名刺','ノートPC・電源','資料','スーツ・シャツ','ネクタイ','革靴','充電器・ケーブル','筆記用具','社員証','領収書入れ']
};
const PRESET_LABEL={domestic:'国内旅行',overseas:'海外旅行',outdoor:'登山・アウトドア',beach:'海水浴・リゾート',business:'ビジネス出張'};
const defaultPresets=()=>Object.keys(PRESETS).map(k=>({id:k,name:PRESET_LABEL[k],items:[...PRESETS[k]]}));
function cleanPresets(a){return(Array.isArray(a)?a:[]).filter(x=>x&&typeof x==='object').map(x=>({id:String(x.id||Math.random().toString(36).slice(2,10)),name:String(x.name||'名前なし'),items:(Array.isArray(x.items)?x.items:[]).map(s=>String(s).trim()).filter(Boolean)}))}
const CUR=[['USD','米ドル',150],['EUR','ユーロ',165],['GBP','英ポンド',195],['CNY','人民元',21],['KRW','韓国ウォン',0.11],['TWD','台湾ドル',4.7],['HKD','香港ドル',19],['THB','タイバーツ',4.4],['SGD','シンガポールドル',115],['VND','ベトナムドン',0.006],['AUD','豪ドル',100],['CAD','カナダドル',110],['CHF','スイスフラン',175]];
const WD=['日','月','火','水','木','金','土'];

const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');
const num=v=>{const n=Number(v);return isFinite(n)?n:0};
function parseD(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function md(s){const d=parseD(s);return d?`${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`:''}
function ymd(s){const d=parseD(s);return d?d.getFullYear()+'/'+md(s):''}
function range(d){if(!d.length)return'';const a=d[0],b=d[d.length-1];if(d.length===1)return ymd(a);return ymd(a)+' – '+(a.slice(0,4)===b.slice(0,4)?md(b):ymd(b))}
function safeUrl(u){return /^https?:\/\//i.test(u||'')?u:''}

function blank(){return{id:uid(),title:'',start:'',end:'',dest:'',members:'',memo:'',
  items:[],packing:[],souvenirs:[],roster:[],
  ins:{company:'',policy:'',from:'',to:'',tel:'',memo:''},
  emg:{police:'',fire:'',hospital:'',embassy:'',other:''},
  split:1,fx:{code:'USD',rate:150},updated:Date.now()}}
function normalize(p){
  const b=blank(),o=Object.assign(b,p&&typeof p==='object'?p:{});
  o.ins=Object.assign(blank().ins,o.ins||{});o.emg=Object.assign(blank().emg,o.emg||{});o.fx=Object.assign(blank().fx,o.fx||{});
  ['items','packing','souvenirs','roster'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[];o[k]=o[k].filter(r=>r&&typeof r==='object');o[k].forEach(r=>{if(!r.id)r.id=uid()})});
  if(!o.id)o.id=uid();return o}
function days(p){
  const s=parseD(p.start),e=parseD(p.end);if(!s)return[];
  const out=[],end=e&&e>=s?e:s;
  for(let d=new Date(s);d<=end&&out.length<31;d.setDate(d.getDate()+1))out.push(iso(d));
  return out}
function nightsText(p){const n=days(p).length;return n?(n===1?'日帰り':`${n-1}泊${n}日`):''}

function sample(){
  const p=blank();
  Object.assign(p,{title:'京都・奈良 冬の旅（サンプル）',start:'2026-12-11',end:'2026-12-13',dest:'京都・奈良',members:'2名（山田・佐藤）',
    memo:'これは入力例です。自由に書き換えるか、「旅程一覧」で新しい旅程を作ってください。',split:2});
  const D=['2026-12-11','2026-12-12','2026-12-13'];
  const it=(date,time,endTime,title,cat,transport,place,cost,url,memo)=>({id:uid(),date,time,endTime,title,cat,transport,place,cost,url:url||'',memo:memo||''});
  p.items=[

/* ---------- storage ---------- */
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function store(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
let lib=[];try{lib=JSON.parse(load(K_LIB)||'[]').map(normalize)}catch(e){lib=[]}
if(!lib.length)lib=[sample()];
let curId=load(K_CUR);if(!lib.some(p=>p.id===curId))curId=lib[0].id;
let presets;try{presets=JSON.parse(load(K_PRE)||'null')}catch(e){presets=null}
presets=presets?cleanPresets(presets):defaultPresets();
function savePresets(){store(K_PRE,JSON.stringify(presets));const el=document.getElementById('saved');if(el){el.textContent='プリセットを保存しました';el.style.opacity=1;clearTimeout(savedTimer);savedTimer=setTimeout(()=>{el.style.opacity=0},1800)}}
const ui={presetOpen:false,presetEdit:null,presetConfirm:null,tab:load(K_TAB)||'schedule',editing:null,confirmDel:null,showRoster:false,showEmg:false,fxAmt:'',fxDir:'toYen',exportText:'',msg:null};
const plan=()=>lib.find(p=>p.id===curId);
let savedTimer;
function save(){
  const ok=store(K_LIB,JSON.stringify(lib));store(K_CUR,curId);
  const el=document.getElementById('saved');
  el.textContent=ok?'自動保存しました':'このブラウザでは保存できません（データ書き出しで控えを取ってください）';
  el.style.opacity=1;clearTimeout(savedTimer);savedTimer=setTimeout(()=>{el.style.opacity=0},1800)}
function touch(){plan().updated=Date.now();save()}

/* ---------- derived ---------- */
function totals(p){
  const it=p.items.reduce((a,r)=>a+num(r.cost),0),sv=p.souvenirs.reduce((a,r)=>a+num(r.price),0);
  const per=Math.max(1,Math.round(num(p.split))||1);
  return{it,sv,all:it+sv,per,each:Math.ceil((it+sv)/per)}}

const TABS=[['library','旅程一覧'],['basic','基本情報'],['schedule','旅程'],['packing','持ち物'],['souvenir','おみやげ'],['cost','費用'],['people','名簿・緊急'],['shiori','しおり'],['data','データ']];

function renderSub(){
  const p=plan(),d=days(p),bits=[];

/* 旅程 */
function sortItems(a){return[...a].sort((x,y)=>(x.time||'99')<(y.time||'99')?-1:(x.time||'99')>(y.time||'99')?1:0)}
function schedule(p){
  const d=days(p),groups=d.map((date,i)=>({date,label:`${i+1}日目`,items:sortItems(p.items.filter(r=>r.date===date))}));
  const loose=sortItems(p.items.filter(r=>!d.includes(r.date)));
  if(loose.length||!d.length)groups.push({date:'',label:'日付未設定',items:loose});
  const body=groups.map(g=>{
    const sub=g.items.reduce((a,r)=>a+num(r.cost),0);
    return`<div class="day"><div class="day-head"><span class="day-no">${g.label}</span><span class="day-date mono">${md(g.date)}</span><span class="day-sum">${g.items.length}件 ・ <span class="mono">${yen(sub)}</span></span></div>
    ${g.items.length?`<ul class="tl">${g.items.map(r=>ui.editing===r.id?`<li>${editor(r,d)}</li>`:evRow(r)).join('')}</ul>`:'<div class="empty-day">まだ予定がありません</div>'}
    <div><button class="btn sm" data-add="items" data-date="${g.date}">＋ 予定を追加</button></div></div>`}).join('');
  return`<section class="card" style="display:flex;flex-direction:column;gap:22px">
  <div class="sec-head"><h2>旅程</h2><span class="hint">旅程の合計 <b class="mono">${yen(totals(p).it)}</b></span></div>
  ${d.length?'':'<p class="note">「基本情報」で出発日と帰着日を入れると、日ごとに予定を分けて表示します。</p>'}
  ${body}</section>`}
function evRow(r){
  const url=safeUrl(r.url),cat=r.cat||'other';
  const meta=[`<span class="chip cat-${cat}">${CAT_LABEL[cat]||'その他'}</span>`];
  if(r.transport)meta.push(`<span class="chip mv">${esc(r.transport)}</span>`);
  if(r.place)meta.push(`<span>${esc(r.place)}</span>`);

  ${r.memo?`<div class="ev-memo">${esc(r.memo)}</div>`:''}${url?`<a class="ev-link" href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>`:''}</div>

  return`<div class="stats"><div class="stat"><span>旅程の合計</span><b>${yen(t.it)}</b></div><div class="stat"><span>おみやげ</span><b>${yen(t.sv)}</b></div>

  ${perDay?`<h3 style="font-size:16px">日別</h3><div class="tbl-wrap"><table class="b-table"><tbody>${perDay}</tbody></table></div>`:''}`}

/* PDF書き出し */
const LIBS={h2c:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',pdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'};
const libP={};
function loadLib(k){return libP[k]||(libP[k]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIBS[k];s.onload=res;s.onerror=()=>{delete libP[k];s.remove();rej(new Error('load'))};document.head.appendChild(s)}))}
const downloadsP=(window.claude&&typeof window.claude.use==='function')?Promise.resolve(window.claude.use('downloads')).catch(()=>null):Promise.resolve(null);
async function exportPdf(btn){
  const out=document.getElementById('pdfMsg');const say=(t,c)=>{if(out){out.textContent=t;out.className='msg '+(c||'')}};
  btn.disabled=true;say('PDFを作成しています…');
  let host;
  try{
    await Promise.all([loadLib('h2c'),loadLib('pdf')]);
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    host=document.createElement('div');host.className='pdf-sheet';
    const clone=document.querySelector('.booklet').cloneNode(true);host.appendChild(clone);document.body.appendChild(host);
    const W=clone.offsetWidth,totalH=clone.offsetHeight,top=clone.getBoundingClientRect().top;
    const breaks=[...new Set([...clone.querySelectorAll('.b-sec,.day,.b-ev:not(.day-head + .b-ev),tbody tr:not(:first-child)')]
      .map(el=>Math.round(el.getBoundingClientRect().top-top)).filter(v=>v>0))].sort((a,b)=>a-b);
    const scale=2;
    const canvas=await html2canvas(clone,{scale,backgroundColor:'#ffffff',logging:false});
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    const M=10,cw=210-2*M,ch=297-2*M-6,pageH=W*ch/cw;
    const pages=[];let y=0;
    while(y<totalH-1){const lim=y+pageH;let next;
      if(lim>=totalH)next=totalH;else{const c=breaks.filter(b=>b>y+pageH*0.4&&b<=lim);next=c.length?c[c.length-1]:lim}
      pages.push([y,next]);y=next}
    pages.forEach(([a,b],i)=>{
      if(i)pdf.addPage();
      const sl=document.createElement('canvas');sl.width=canvas.width;sl.height=Math.max(1,Math.ceil((b-a)*scale));
      const g=sl.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,sl.width,sl.height);g.drawImage(canvas,0,-Math.round(a*scale));
      pdf.addImage(sl.toDataURL('image/jpeg',0.92),'JPEG',M,M,cw,(b-a)*cw/W);
      pdf.setFontSize(9);pdf.setTextColor(130);pdf.text(`${i+1} / ${pages.length}`,105,290,{align:'center'})});
    const name=(plan().title||'').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'').trim().slice(0,80)||'旅程';
    const filename=`旅のしおり_${name}.pdf`;
    const dl=await downloadsP;
    if(dl){
      try{await dl.save({filename,data:pdf.output('blob')});say(`PDF（${pages.length}ページ）を保存しました。`,'ok')}
      catch(err){const c=err&&err.code;
        say(c==='declined'?'保存をキャンセルしました。':c==='rate_limited'?'保存の確認画面がすでに開いています。閉じてからもう一度押してください。':'この画面ではファイルを保存できませんでした。','err')}
    }else{pdf.save(filename);say(`PDF（${pages.length}ページ）をダウンロードしました。`,'ok')}
  }catch(e){say('PDFを作成できませんでした。インターネット接続を確認して、もう一度押してください。','err')}
  finally{if(host)host.remove();btn.disabled=false}
}

/* JSON保存 */
async function saveJson(all,btn){
  const p=plan(),name=(p.title||'').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'').trim().slice(0,80)||'旅程';
  const text=all?JSON.stringify({app:'tabi-shiori',plans:lib,presets},null,2):JSON.stringify(p,null,2);
  const filename=all?`旅のしおり_全旅程_${iso(new Date())}.json`:`旅のしおり_${name}.json`;
  btn.disabled=true;
  try{
    const dl=await downloadsP;
    if(dl){
      try{await dl.save({filename,data:text});msg('export','ok',`「${filename}」を保存しました。`)}
      catch(err){const c=err&&err.code;
        msg('export','err',c==='declined'?'保存をキャンセルしました。':c==='rate_limited'?'保存の確認画面がすでに開いています。閉じてからもう一度押してください。':'この画面ではファイルを保存できませんでした。「テキストで表示」からコピーしてください。')}
    }else{
      const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
      const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000);
      msg('export','ok',`「${filename}」をダウンロードしました。`)}
  }finally{const nb=document.querySelector(`[data-act="${all?'save-all':'save-cur'}"]`);if(nb)nb.disabled=false}
}

function importText(txt){
  let obj;try{obj=JSON.parse(txt)}catch(e){return msg('import','err','JSONとして読み込めませんでした。書き出したテキストをそのまま貼り付けてください。')}
  let preAdded=0;
  if(obj&&Array.isArray(obj.presets)){const names=new Set(presets.map(x=>x.name));
    cleanPresets(obj.presets).forEach(x=>{if(!names.has(x.name)){x.id=uid();presets.push(x);names.add(x.name);preAdded++}});if(preAdded)savePresets()}
  const preNote=preAdded?`持ち物プリセットも${preAdded}件追加しました。`:'';
  const arr=Array.isArray(obj)?obj:Array.isArray(obj&&obj.plans)?obj.plans:[obj];
  const valid=arr.filter(x=>x&&typeof x==='object'&&('title' in x||'items' in x));
  if(!valid.length)return preAdded?msg('import','ok',`持ち物プリセットを${preAdded}件追加しました。`):msg('import','err','旅程のデータが見つかりませんでした。');
  const room=MAX_PLANS-lib.length;
  if(room<=0)return msg('import','err',`保存できる旅程は${MAX_PLANS}件までです。「旅程一覧」で不要な旅程を削除してください。`);
  const add=valid.slice(0,room).map(x=>{const n=normalize(JSON.parse(JSON.stringify(x)));if(lib.some(p=>p.id===n.id))n.id=uid();n.updated=Date.now();return n});
  lib.push(...add);curId=add[0].id;save();
  msg('import','ok',`${add.length}件の旅程を取り込み、「${add[0].title||'タイトル未設定'}」を開きました。`+(valid.length>add.length?`（上限のため${valid.length-add.length}件は取り込んでいません）`:'')+preNote);
}

}

function addPreset(k){

document.addEventListener('click',e=>{

    if(d.add==='items')row={id:uid(),date:d.date||'',time:'',endTime:'',title:'',cat:'sight',transport:'',place:'',cost:'',url:'',memo:''};
    else if(d.add==='packing')row={id:uid(),name:'',checked:false};
    else if(d.add==='souvenirs')row={id:uid(),item:'',shop:'',to:'',price:'',memo:''};
    else if(d.add==='roster')row={id:uid(),name:'',tel:'',mail:'',emg:'',memo:''};
    p[d.add].push(row);if(d.add==='items')ui.editing=row.id;touch();render();
    const first=d.add==='items'?document.getElementById('e-title-'+row.id):document.querySelector(`[data-id="${row.id}"][type=text]`);if(first)first.focus();return}
  if(d.del){p[d.del]=p[d.del].filter(r=>r.id!==d.id);if(ui.editing===d.id)ui.editing=null;touch();render();return}
  switch(d.act){
    case'close-edit':ui.editing=null;render();break;
    case'pdf':exportPdf(b);break;
    case'clear-checked':p.packing=p.packing.filter(r=>!r.checked);touch();render();break;
    case'preset-toggle':ui.presetOpen=!ui.presetOpen;ui.presetConfirm=null;render();break;
    case'preset-pick':ui.presetEdit=d.id;ui.presetConfirm=null;render();break;
    case'preset-new':case'preset-save-list':{
      const x=d.act==='preset-new'?{id:uid(),name:'新しいプリセット',items:[]}:{id:uid(),name:p.title?p.title.replace(/（サンプル）$/,'')+'の持ち物':'マイプリセット',items:packNames(p)};
      presets.push(x);ui.presetEdit=x.id;ui.presetConfirm=null;savePresets();render();
      const el=document.getElementById('pre-name');if(el){el.focus();el.select()}break}
    case'preset-from-list':{const x=presets.find(q=>q.id===ui.presetEdit);if(x){x.items=packNames(p);savePresets();render()}break}
    case'preset-ask':ui.presetConfirm=d.key;render();break;
    case'preset-cancel':ui.presetConfirm=null;render();break;
    case'preset-del':presets=presets.filter(q=>q.id!==ui.presetEdit);ui.presetEdit=null;ui.presetConfirm=null;savePresets();render();break;
    case'preset-reset':presets=defaultPresets();ui.presetEdit=null;ui.presetConfirm=null;savePresets();render();break;
    case'new-plan':case'add-sample':case'dup-plan':{
      if(lib.length>=MAX_PLANS){msg('library','err',`保存できる旅程は${MAX_PLANS}件までです。不要な旅程を削除してください。`);break}
      let n;if(d.act==='new-plan')n=blank();else if(d.act==='add-sample')n=sample();
      else{n=normalize(JSON.parse(JSON.stringify(lib.find(x=>x.id===d.id))));n.id=uid();n.title=(n.title||'旅程')+'（コピー）';n.updated=Date.now()}
      lib.push(n);curId=n.id;ui.msg=null;save();ui.tab=d.act==='new-plan'?'basic':'library';store(K_TAB,ui.tab);render();break}
    case'open-plan':curId=d.id;ui.editing=null;ui.msg=null;save();ui.tab='schedule';store(K_TAB,'schedule');render();break;
    case'ask-del':ui.confirmDel=d.id;render();break;
    case'cancel-del':ui.confirmDel=null;render();break;
    case'del-plan':lib=lib.filter(x=>x.id!==d.id);if(!lib.length)lib=[blank()];if(!lib.some(x=>x.id===curId))curId=[...lib].sort((a,b)=>b.updated-a.updated)[0].id;ui.confirmDel=null;save();render();break;
    case'save-cur':case'save-all':saveJson(d.act==='save-all',b);break;
    case'export-cur':ui.exportText=JSON.stringify(p,null,2);ui.msg=null;render();break;
    case'export-all':ui.exportText=JSON.stringify({app:'tabi-shiori',plans:lib,presets},null,2);ui.msg=null;render();break;
    case'copy':{const box=document.getElementById('exportBox');
      const fallback=()=>{box.focus();box.select();ui.msg={where:'export',type:'ok',text:'テキストを選択しました。Ctrl+C（⌘+C）でコピーしてください。'};const m=document.createElement('p');m.className='msg ok';m.textContent=ui.msg.text;box.after(m)};
      try{navigator.clipboard.writeText(ui.exportText).then(()=>msg('export','ok','コピーしました。'),fallback)}catch(err){fallback()}break}
    case'import':{const txt=document.getElementById('importBox').value.trim();if(!txt){msg('import','err','ファイルを選ぶか、テキストを貼り付けてください。');break}importText(txt);break}
  }
});
render();
})();
</script>
</body>
</html>
